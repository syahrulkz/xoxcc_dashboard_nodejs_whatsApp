<script>
    let currentLoggedInUser = localStorage.getItem('xox_activeUser'] || "";

    function checkSessionOnLoad() {
        if (currentLoggedInUser) {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('filter', 'blur-sm', 'pointer-events-none');
            document.getElementById('loggedInUserDisplay').innerText = currentLoggedInUser;
        }
    }
    checkSessionOnLoad();

    function handleLogin(event) {
        event.preventDefault();
        const user = document.getElementById('usernameInput').value.trim().toLowerCase();
        currentLoggedInUser = user;
        localStorage.setItem('xox_activeUser', user);
        document.getElementById('authModal').classList.add('hidden');
        document.getElementById('mainDashboard').classList.remove('filter', 'blur-sm', 'pointer-events-none');
        document.getElementById('loggedInUserDisplay').innerText = user;
    }

    function handleLogout() {
        localStorage.removeItem('xox_activeUser');
        location.reload();
    }

    let currentFilter = 'all';
    let allRawLogs = []; // Stores ALL logs for the "All" tab
    let activeLogsMap = new Map(); // Stores filtered extension logs for 2001/2002 tabs

    function setFilter(filterType) {
        currentFilter = filterType;
        ['all', '2001', '2002', '2001_2002'].forEach(f => {
            const btn = document.getElementById(`filterBtn-${f}`);
            if (btn) {
                btn.className = (f === filterType) ? "px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-medium transition-colors" : "px-2.5 py-1 rounded-lg text-gray-400 hover:text-white transition-colors";
            }
        });
        renderTerminal();
    }

    function renderTerminal() {
        const terminalOutput = document.getElementById('terminalOutput');
        
        // 1. "ALL" TAB: Displays every single raw log line hitting the server
        if (currentFilter === 'all') {
            if (allRawLogs.length === 0) {
                terminalOutput.innerHTML = `<div class="text-gray-500 italic"># Waiting for live logs from server...</div>`;
                return;
            }
            terminalOutput.innerHTML = allRawLogs.map(log => `<div class="p-2 border-b border-bordercol/30 text-gray-300 font-mono text-[10px] break-all">${log}</div>`).join('');
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
            return;
        }

        // 2. EXTENSION TABS (2001, 2002, 2001 & 2002): Display ONLY green WhatsApp matched payloads
        const entriesArray = Array.from(activeLogsMap.values());
        const filtered = entriesArray.filter(call => {
            if (currentFilter === '2001') return call.extension === '2001';
            if (currentFilter === '2002') return call.extension === '2002';
            if (currentFilter === '2001_2002') return call.extension === '2001' || call.extension === '2002';
            return false;
        });

        if (filtered.length === 0) {
            terminalOutput.innerHTML = `<div class="text-gray-500 italic"># No WhatsApp events for extension ${currentFilter.replace('_', ' & ')} yet...</div>`;
            return;
        }

        terminalOutput.innerHTML = filtered.map(call => `
            <div class="p-3 rounded-xl border border-emerald-500/50 bg-emerald-950/10 transition-all mb-3">
                <div class="text-gray-500">[${call.time}] whatsapp_sending {</div>
                <div class="pl-4 space-y-0.5">
                    <div>callId: <span class="text-cyan-400">'${call.callId}'</span>,</div>
                    <div>phone: <span class="text-amber-400">'${call.phone}'</span>,</div>
                    <div>extension: <span class="text-emerald-400 font-bold">'${call.extension}'</span>,</div>
                    <div>template: <span class="text-purple-400">'${call.template}'</span></div>
                </div>
                <div class="text-gray-500">}</div>
            </div>
        `).join('');
        terminalOutput.scrollTop = terminalOutput.scrollHeight;
    }

    // CONNECT TO NODE.JS WEBSOCKET SERVER
    function connectToNodeServer() {
        const ws = new WebSocket('ws://103.191.74.17:3000');

        ws.onopen = () => {
            document.getElementById('nodeStatusText').innerText = "ONLINE";
            document.getElementById('nodeStatusBadge').className = "px-2.5 py-0.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-semibold rounded-full flex items-center gap-1.5";
            document.getElementById('nodeStatusDot').className = "w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse";
        };

        ws.onmessage = (event) => {
            const rawData = event.data;
            
            // Push everything to the "All" tab array
            allRawLogs.push(rawData);
            if (allRawLogs.length > 100) allRawLogs.shift();

            // Try parsing JSON to catch green extension payloads for 2001/2002 tabs
            try {
                const data = JSON.parse(rawData);
                if (data.extension === '2001' || data.extension === '2002') {
                    const phone = data.phone;
                    const timeStr = new Date().toISOString().replace('Z', '+08:00').split('.')[0];
                    const callData = { time: timeStr, callId: data.callId, phone: phone, extension: data.extension, template: data.template };

                    if (activeLogsMap.has(phone)) activeLogsMap.delete(phone);
                    activeLogsMap.set(phone, callData);
                    if (activeLogsMap.size > 40) activeLogsMap.delete(activeLogsMap.keys().next().value);
                }
            } catch (err) {
                // Non-JSON standard CDR logs are safely ignored here and stay visible only in the "All" tab
            }

            renderTerminal();
        };

        ws.onclose = () => {
            document.getElementById('nodeStatusText').innerText = "DISCONNECTED";
            document.getElementById('nodeStatusBadge').className = "px-2.5 py-0.5 bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] font-semibold rounded-full flex items-center gap-1.5";
            document.getElementById('nodeStatusDot').className = "w-1.5 h-1.5 rounded-full bg-rose-400";
            setTimeout(connectToNodeServer, 4000);
        };
    }

    connectToNodeServer();

    function runTestNetConnection() {
        const ip = document.getElementById('targetIpInput').value;
        const port = document.getElementById('targetPortInput').value;
        const psOutput = document.getElementById('psOutputContainer');
        psOutput.innerHTML = `<span class="text-gray-500">Testing connection to ${ip} on port ${port}...</span>`;
        setTimeout(() => {
            psOutput.innerHTML = `
                <div class="space-y-1">
                    <div class="text-emerald-400 font-bold">ComputerName     : ${ip}</div>
                    <div>RemoteAddress    : ${ip}</div>
                    <div>RemotePort       : ${port}</div>
                    <div>InterfaceAlias : Ethernet</div>
                    <div>SourceAddress  : 192.168.2.89</div>
                    <div class="text-emerald-400 font-bold pt-1">TcpTestSucceeded : True</div>
                </div>
            `;
        }, 500);
    }
</script>
